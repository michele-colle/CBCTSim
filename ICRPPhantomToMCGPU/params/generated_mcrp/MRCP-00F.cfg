# mcrp_to_vox parameter file — FIXED OUTPUT-VOLUME (production) template.
# Lines starting with # are comments.  All distances in mm.
#
# The batcher (batch_mcrp_to_vox.py) appends per-phantom overrides at the end
# (phantom_name, mcgpu_output_name).  Last value wins, so the appended lines
# override the placeholders below.
#
# COORDINATE SYSTEM: origin = ISOCENTER = centre of the output volume.
#   Voxel [i,j,k] centre:  x = (i+0.5)*vxy - Nx*vxy/2,  y = ...,  z = ...
# The MRCP phantom is placed INSIDE this fixed air volume:
#   - the head tip (max Z) is anchored near the TOP OF THE CBCT BEAM'S
#     RECONSTRUCTED FOV (not the volume's own top face) — see head_top_margin_mm
#     below — so the FOV stays centred on the head instead of clipping its top,
#   - the head (top head_region_mm) is centred on the isocenter in XY.
# Volume dimensions are identical for every phantom regardless of age; only the
# amount of anatomy captured in the 30 cm below the head tip changes.

# ── Phantom (overridden per-phantom by the batcher) ──────────────────────────
phantom_name  = MRCP_AF

# Base folder every output subfolder is written under.  Relative (to wherever
# the binary is run from) or absolute; quote if it contains spaces.  Override
# with the batcher's --output-dir to redirect every phantom at once, e.g. onto
# a data drive instead of the repo's ./output.
# output_dir = /mnt/f/Michele_diskF/mcrp_mcgpu_output

# ── Fixed output volume geometry (matches / exceeds the DICOM-generated ones) ─
vol_vxy_mm    = 0.3     # isotropic XY voxel size [mm]
vol_vz_mm     = 0.3     # Z voxel size [mm]
vol_width_mm  = 640.0   # total X extent [mm]
vol_height_mm = 640.0   # total Y extent [mm]
vol_length_mm = 300.0   # total Z extent [mm]  (30 cm from the head tip down)

# ── Head placement ───────────────────────────────────────────────────────────
# Top slab (from the head tip) used to centre the head in XY and to seat the
# stretcher behind the head's posterior surface.
head_region_mm = 100.0

# Air gap kept between the head tip and the top of the CBCT beam's
# reconstructed field of view.  The FOV half-height is derived automatically
# from mcgpu_in_template's beam geometry (source position, source-to-detector
# distance, detector height) — NOT from vol_length_mm — so the head tip is
# pulled down off the volume's top face until its very top sits just inside
# (margin below) the FOV edge, leaving air above it.  Falls back to the same
# margin below the volume's own top face if no template geometry is parseable.
head_top_margin_mm = 10.0

# ── HU thresholds [HU] ───────────────────────────────────────────────────────
# label 0=air, 1=fat, 2=soft tissue, 3=bone spongiosa, 4=bone cortical
thr_air_fat        = -500
thr_fat_soft       =  -50
thr_soft_spongiosa =  200
thr_spongiosa_cort =  800

# ── Geometry fine-offset [mm] (added only to the .txt/.in offset) ────────────
shift_x_mm = 0.0
shift_y_mm = 0.0
shift_z_mm = 0.0

# ── Crop cylinder (axis along Z, isocenter coords) ───────────────────────────
crop_cylinder_enable    = false
crop_cylinder_radius_mm = 100.0
crop_cylinder_cx_mm     = 0.0
crop_cylinder_cy_mm     = 0.0

# ── Implant cylinders (isocenter coords, axis along Z) ───────────────────────
implant_count = 0

# ── Stretcher shell (rounded polygon; carbon wall=10, foam core=11) ──────────
# Same profile as dicom_to_mcgpu (440/396 mm trapezoid, 57 mm high, chamfered,
# 5 mm rounding, 1.5 mm carbon wall).  With stretcher_auto=true the shell is
# seated automatically just behind the head's posterior (+Y) surface — the
# consolidated AM/AF convention — so it follows the head as size varies by age.
#   stretcher_cx_mm  : lateral offset of the polygon centre from isocenter [mm]
#   stretcher_gap_mm : gap between the head's posterior surface and the shell top
#   stretcher_cy_mm  : used ONLY when stretcher_auto = false
stretcher_enable = true
stretcher_auto   = true
stretcher_cx_mm  = 0.0
stretcher_gap_mm = 2.0
# stretcher_cy_mm = 133.5   # (manual override; requires stretcher_auto = false)

# ── MC-GPU simulation template(s) ─────────────────────────────────────────────
# One or more .in templates separated by ',' or ';'.  The volume is voxelized
# once; one .in is written per template.  The material list is copied VERBATIM
# from the template (fixed across phantoms — geometry is the focus, not the
# per-phantom material spectrum).
mcgpu_in_template = params/cbct_head_bar_template.in
mcgpu_output_name = results/
mcgpu_det_nx      = 978
mcgpu_det_nz      = 978

# ===== batch overrides (appended; last value wins) =====
phantom_name = MRCP-00F
mcgpu_output_name = results/MRCP-00F_

# mcrp_to_vox parameter file
# Lines starting with # are comments. Values after # on a line are ignored.
# All distances in mm.

# ── Phantom ──────────────────────────────────────────────────────────────────
phantom_name   = MRCP_AF
voxel_size_mm  = 1.0

# ── ROI [mm from bbMin of the MRCP volume] ───────────────────────────────────
# Set a value to -1 to use the full extent on that axis.
x_start_mm     = 0.0
x_end_mm       = -1       # full X
y_start_mm     = 0.0
y_end_mm       = -1       # full Y
z_start_mm     = 0.0
z_end_mm       = -1       # full Z

# ── Implant cylinder (axis along Z, perpendicular to slices) ─────────────────
# Coordinates are absolute in the voxel volume [mm from bbMin].
# Set implant_radius_mm <= 0 to disable the implant entirely.
implant_cx_mm      = 275.5
implant_cy_mm      = 74.5
implant_cz_mm      = 1462.0
implant_radius_mm  = 0
implant_height_mm  = 22.0

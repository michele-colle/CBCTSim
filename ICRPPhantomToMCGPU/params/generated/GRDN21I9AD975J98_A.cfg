# dicom_to_mcgpu parameter file
# Lines starting with # are comments.  All distances in mm.
#
# COORDINATE SYSTEM: origin = ISOCENTER = centre of the output volume.
#   Voxel [i,j,k] centre:  x = (i+0.5)*vxy - Nx*vxy/2,  y = ...,  z = ...

# ── Input / Output ───────────────────────────────────────────────────────────
#dicom_dir      = F:\Michele_diskF\segmed\Selected\00_head_thin\
dicom_dir= "/mnt/f/Michele_diskF/Test Fantoccio Zurigo-CBCTvsCT/patient_ct_registered"
output_prefix  = "/mnt/f/Michele_diskF/Test Fantoccio Zurigo-CBCTvsCT/MCGPU"
# series_uid   =                           # leave empty to pick the first series

# ── Output volume geometry ───────────────────────────────────────────────────
# If omitted the output matches the DICOM physical extent at the given spacing.
vol_vxy_mm    = 0.3   # isotropic XY voxel size [mm]
vol_vz_mm     = 0.3   # Z voxel size [mm]
vol_width_mm  = 640.0   # total X extent [mm]
vol_height_mm = 640.0   # total Y extent [mm]
vol_length_mm = 250.0   # total Z extent [mm]

# ── DICOM placement ──────────────────────────────────────────────────────────
# dicom_corner_*_mm: isocenter coords of the DICOM [0,0,0] corner.
# Default (omitted): DICOM centred in the output volume.
# Example: set to (-nx_d*sx/2, ...) to centre manually, or to any offset.
# dicom_corner_x_mm = 0.0
# dicom_corner_y_mm = 0.0
#dicom_corner_z_mm = -70.0

# 3D rotation of the DICOM around its own centre (XYZ intrinsic Euler, degrees).
# dicom_rot_x_deg = 0.0
# dicom_rot_y_deg = 0.0
# dicom_rot_z_deg = 0.0

# ── Segmentation mask (NRRD) ─────────────────────────────────────────────────
# Optional: NRRD label file (e.g. 3D Slicer segmentation) in the same physical
# space as the DICOM.  Voxels where the mask == 0 are forced to air (-1000 HU,
# label 0) and excluded from the phantom.  Leave empty to disable.
#mask_nrrd = "/home/colle/GradientHealthExport/export/GRDN17YG2OQIYVPO/20250914_92664499/Segmentation-Segment_1-label.nrrd"

# ── HU thresholds [HU] ───────────────────────────────────────────────────────
# label 0=air, 1=fat, 2=soft tissue, 3=bone spongiosa, 4=bone cortical
thr_air_fat        = -500
thr_fat_soft       =  -50
thr_soft_spongiosa =  200
thr_spongiosa_cort =  800

# ── Geometry fine-offset [mm] ────────────────────────────────────────────────
# Added only to the MC-GPU .txt offset (does NOT move the phantom in the volume).
shift_x_mm = 0#-6.19973
shift_y_mm = 0#24.4212
shift_z_mm = 0#34.8167

# ── MC-GPU simulation template(s) ─────────────────────────────────────────────
# One or more .in templates, separated by commas (or semicolons).  The volume
# is voxelized once; one .in is written per template.  With several templates
# each output is "CBCT_<template-stem>.in" and its OUTPUT IMAGE FILE NAME is
# suffixed with the stem; with a single template it stays "CBCT.in".
mcgpu_in_template  = params/cbct_head_bar_template.in, params/cbct_bar_only_template.in, params/cbct_head_only_template.in
mcgpu_output_name  = results/
mcgpu_det_nx       = 512
mcgpu_det_nz       = 512

# ── DICOM output (HU values) ─────────────────────────────────────────────────
# Output folder is derived automatically from output_prefix as:
#   <output_prefix>_vox_<Nx>x<Ny>x<Nz>_<vxy>mm_dicom/
# i.e. the MC-GPU folder name with a _dicom suffix.
# Carbon = 3000 HU, foam = -100 HU, implant = 3000 HU, air = -1000 HU.
write_dicom = false

# ── Crop cylinder (axis along Z, isocenter coords) ───────────────────────────
crop_cylinder_enable    = false
crop_cylinder_radius_mm = 100.0
crop_cylinder_cx_mm     = 0.0
crop_cylinder_cy_mm     = 0.0


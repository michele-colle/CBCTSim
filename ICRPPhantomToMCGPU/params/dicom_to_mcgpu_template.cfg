# dicom_to_mcgpu parameter file
# Lines starting with # are comments. Values after # on a line are ignored.
# All distances in mm.

# ── Input / Output ───────────────────────────────────────────────────────────
dicom_dir      = /path/to/dicom/series/    # directory containing .dcm files
output_prefix  = patient_scan              # used as folder/file name stem
# series_uid   =                           # leave empty to pick the first series

# ── HU thresholds [HU] ───────────────────────────────────────────────────────
# label 0=air, 1=fat, 2=soft tissue, 3=bone spongiosa, 4=bone cortical
thr_air_fat        = -500
thr_fat_soft       =  -50
thr_soft_spongiosa =  200
thr_spongiosa_cort =  800

# ── Crop cylinder (zeros everything outside; axis along Z, full height) ──────
# Centre coordinates are in mm from the volume origin (voxel [0,0,0] corner).
crop_cylinder_enable    = false
crop_cylinder_radius_mm = 100.0
crop_cylinder_cx_mm     = 0.0
crop_cylinder_cy_mm     = 0.0

# ── Implant cylinders (axis along Z, perpendicular to slices) ────────────────
# implant_count = 0  → no implant added
# Coordinates are in mm from the volume origin.
implant_count = 0

# Example: one implant
# implant_count = 1
# implant_0_cx_mm     = 150.0
# implant_0_cy_mm     = 120.0
# implant_0_cz_mm     =  80.0
# implant_0_radius_mm =   2.5
# implant_0_height_mm =  22.0

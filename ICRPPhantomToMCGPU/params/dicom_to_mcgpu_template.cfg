# dicom_to_mcgpu parameter file
# Lines starting with # are comments. Values after # on a line are ignored.
# All distances in mm.

# ── Input / Output ───────────────────────────────────────────────────────────
dicom_dir      = output\AF_head_vox_235x264x273\AF_head_vox_registered_235x264x273\ScalarVolume_18    # directory containing .dcm files
output_prefix  = ../AF_head_registered_mariaCristeta_barella             # used as folder/file name stem
# series_uid   =                           # leave empty to pick the first series

# ── HU thresholds [HU] ───────────────────────────────────────────────────────
# label 0=air, 1=fat, 2=soft tissue, 3=bone spongiosa, 4=bone cortical
thr_air_fat        = -500
thr_fat_soft       =  -50
thr_soft_spongiosa =  200
thr_spongiosa_cort =  800

# ── Geometry offset [mm] ─────────────────────────────────────────────────────
# Added to the centred-corner offset written in the MC-GPU .txt file.
# Final offset [cm] = -(N*size/2) + shift   (converted to cm)
shift_x_mm = -6.19973 
shift_y_mm = 24.4212
shift_z_mm = 34.8167

# ── MC-GPU simulation template ───────────────────────────────────────────────
# If set, a ready-to-run .in file is written next to the .raw output.
# The [SECTION VOXELIZED GEOMETRY FILE] block is replaced with the actual
# phantom path (absolute), offset, dimensions and voxel sizes.  All other
# sections are copied verbatim from the template.
mcgpu_in_template  = params/cbct_MCRP_AF_template.in
mcgpu_output_name  = results/AF_head_reg_mariaCristeta_bar/AF_head_registered_mariaCristeta_barella_   # base path; NxNz appended automatically
mcgpu_det_nx       = 512
mcgpu_det_nz       = 512

# ── Crop cylinder (zeros everything outside; axis along Z, full height) ──────
# Centre coordinates are in mm from the volume origin (voxel [0,0,0] corner).
crop_cylinder_enable    = false
crop_cylinder_radius_mm = 100.0
crop_cylinder_cx_mm     = 0.0
crop_cylinder_cy_mm     = 0.0

# ── Implant cylinders (axis along Z, perpendicular to slices) ────────────────
# implant_count = 0  → no implant added
# Coordinates are in mm from the volume origin.
implant_count = 0

# Example: one implant
# implant_count = 1
# implant_0_cx_mm     = 150.0
# implant_0_cy_mm     = 120.0
# implant_0_cz_mm     =  80.0
# implant_0_radius_mm =   2.5
# implant_0_height_mm =  22.0

# ── Stretcher (two adjacent boxes along the XZ plane, full Z extent) ─────────
# The stretcher is composed of:
#   label 10 – carbon fibre (structural side, -Y half of the assembly)
#   label 11 – foam padding (patient-contact side, +Y half of the assembly)
# cx_mm / cy_mm: centre of the whole assembly relative to the isocenter
#   (isocenter = DICOM volume centre + shift_x/y_mm).
# The volume is automatically zero-padded to accommodate the stretcher when it
# falls outside the current DICOM bounds; the geometry shift is updated so the
# isocenter remains fixed.
stretcher_enable              = true
stretcher_cx_mm               =   0.0   # X centre from isocenter [mm]
stretcher_cy_mm               = 150.0  # Y centre from isocenter [mm]
stretcher_width_mm            = 443.0   # full X extent [mm]
stretcher_carbon_thickness_mm =   2.0   # carbon layer thickness (label 10) [mm]
stretcher_foam_thickness_mm   =  36.0   # foam layer thickness   (label 11) [mm]

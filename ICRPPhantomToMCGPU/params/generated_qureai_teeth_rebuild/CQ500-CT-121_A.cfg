# ── Stretcher shell (corner-relative coords, full Z extent) ──────────────────
# top_x/top_y: distance from the upper-left corner of the output volume
# (minimum X / minimum Y voxel) to the centre of the TOP EDGE of the
# stretcher cross-section as seen in the DICOM viewer [mm].
#
# "Top edge in viewer" = upper boundary of the stretcher shape = minimum-Y
# side of the cross-section = underside of the physical stretcher.
# This is the edge that appears first when scanning down from the top of
# the axial image, and is the easiest to measure directly in a DICOM viewer.
#
#   top_x_mm  = vol_width_mm/2  + cx_iso          (cx_iso = isocenter X of polygon centre)
#   top_y_mm  = vol_height_mm/2 + cy_iso - h/2    (h = 57 mm, stretcher total height)
#
# Conversion back to isocenter (done automatically in code):
#   cx_iso = top_x_mm - vol_width_mm/2
#   cy_iso = top_y_mm - vol_height_mm/2 + 28.5
#
# Shape parameters (top_w, bot_w, h, wall_t, chamfer, corner_r) are
# hardcoded in the source; edit stretcher_profile.py to visualise them.
stretcher_enable  = true
stretcher_cx_mm = -11.401
stretcher_cy_mm = 195.554


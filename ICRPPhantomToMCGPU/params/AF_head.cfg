# mcrp_to_vox parameter file
# Lines starting with # are comments. Values after # on a line are ignored.
# All distances in mm.

# ── Phantom ──────────────────────────────────────────────────────────────────
phantom_name   = MRCP_AF
voxel_size_mm  = 0.5

# ── ROI [mm from bbMin of the MRCP volume] ───────────────────────────────────
# Set a value to -1 to use the full extent on that axis.
x_start_mm     = 158.0
x_end_mm       = 345       # full X
y_start_mm     = 0.0
y_end_mm       = 211.0       # full Y
z_start_mm     = 1412.0
z_end_mm       = -1       # full Z

# ── Crop cylinder (zeros everything outside; axis along Z, full height) ──────
# Center in absolute coords from bbMin corner [mm] — same system as implant.
crop_cylinder_enable    = false
crop_cylinder_radius_mm = 86.0
crop_cylinder_cx_mm     = 254.0
crop_cylinder_cy_mm     = 86.0

# ── HU thresholds [HU] ───────────────────────────────────────────────────────
# label 0=air, 1=fat, 2=soft tissue, 3=bone spongiosa, 4=bone cortical
thr_air_fat        = -500
thr_fat_soft       =  -50
thr_soft_spongiosa =  200
thr_spongiosa_cort =  800

# ── Geometry offset [mm] ─────────────────────────────────────────────────────
# Added to the centred-corner offset written in the MC-GPU .txt file.
# Final offset [cm] = -(N*size/2) + shift   (converted to cm)
shift_x_mm = 0.0 
shift_y_mm = 0.0
shift_z_mm = 0.0

# ── MC-GPU simulation template ───────────────────────────────────────────────
# The [SECTION VOXELIZED GEOMETRY FILE] and [SECTION IMAGE DETECTOR] blocks are
# replaced with the actual phantom path, offset, dimensions, voxel sizes and
# detector pixel count. All other sections are copied verbatim from the template.
mcgpu_in_template  = params/cbct_MCRP_AF_template.in
mcgpu_output_name  = results/AF_head_impl_bar/AF_head_impl_bar120_kV
mcgpu_det_nx       = 512
mcgpu_det_nz       = 512

# ── Implant cylinders (axis along Z, perpendicular to slices) ────────────────
# implant_count = 0  → no implant added
# Coordinates are in mm relative to the isocenter (same convention as stretcher).

implant_count = 6

implant_0_cx_mm     = -24.000
implant_0_cy_mm     = -35.000
implant_0_cz_mm     = -55.250
implant_0_radius_mm =   2.500
implant_0_height_mm =  22.000

implant_1_cx_mm     = -21.250
implant_1_cy_mm     = -40.750
implant_1_cz_mm     = -55.250
implant_1_radius_mm =   2.500
implant_1_height_mm =  22.000

implant_2_cx_mm     = -16.250
implant_2_cy_mm     = -50.250
implant_2_cz_mm     = -55.250
implant_2_radius_mm =   2.500
implant_2_height_mm =  22.000

implant_3_cx_mm     =  15.250
implant_3_cy_mm     = -53.750
implant_3_cz_mm     = -55.250
implant_3_radius_mm =   2.500
implant_3_height_mm =  22.000

implant_4_cx_mm     =  18.250
implant_4_cy_mm     = -47.750
implant_4_cz_mm     = -55.250
implant_4_radius_mm =   2.500
implant_4_height_mm =  22.000

implant_5_cx_mm     =  21.250
implant_5_cy_mm     = -39.750
implant_5_cz_mm     = -55.250
implant_5_radius_mm =   2.500
implant_5_height_mm =  22.000

# ── Stretcher (two adjacent boxes along the XZ plane, full Z extent) ─────────
# The stretcher is composed of:
#   label 10 – carbon fibre (structural side, -Y half of the assembly)
#   label 11 – foam padding (patient-contact side, +Y half of the assembly)
# cx_mm / cy_mm: centre of the assembly relative to the isocenter
#   (isocenter = centre of the slice ROI).
# The volume is automatically zero-padded to accommodate the stretcher when it
# falls outside the current bounds; the geometry shift is updated so the
# isocenter remains fixed.
stretcher_enable              = true
stretcher_cx_mm               = 0.0 # X centre from isocenter [mm]
stretcher_cy_mm               = 124  # Y centre from isocenter [mm]
stretcher_width_mm            = 443.0   # full X extent [mm]
stretcher_carbon_thickness_mm =   2.0   # carbon layer thickness (label 10) [mm]
stretcher_foam_thickness_mm   =  36.0   # foam layer thickness   (label 11) [mm]




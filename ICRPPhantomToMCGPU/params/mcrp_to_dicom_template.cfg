# mcrp_to_vox parameter file — TIGHT-CROP DICOM EXPORT mode.
# Lines starting with # are comments.  All distances in mm.
#
# Exports ONLY a DICOM HU series per phantom — no labels, no MC-GPU .raw/.txt/
# .in, no overlays (implant/crop/stretcher).  The output volume is sized to
# the ACTUAL captured anatomy (head tip down to vol_length_mm, clamped to the
# phantom's own extent if shorter — e.g. a newborn) plus a flat air_margin_mm
# on every side, instead of a large fixed volume.
#
# This DICOM is meant to be fed into dicom_to_mcgpu (as if it were a real
# patient series) for placement into the final fixed MC-GPU volume, stretcher
# overlay, and stretcher-position data augmentation. See
# HANDOUT_mcrp_dicom_stretcher_augmentation.md for the full plan and the
# placement logic (head/FOV anchoring, stretcher auto-seat) that still lives
# — dormant, not yet ported — in mcrp_to_vox.cpp's other (fixed-volume) mode.
#
# The batcher (batch_mcrp_to_dicom.py) appends phantom_name as an override at
# the end of this template.  Last value wins.

tight_crop_dicom = true

# ── Phantom (overridden per-phantom by the batcher) ──────────────────────────
phantom_name  = MRCP_AF

# Base folder every phantom's <phantom>_dicom_<dims>/ series is written under.
# Relative (to wherever the binary is run from) or absolute; quote if it
# contains spaces.  Override with the batcher's --output-dir to redirect
# every phantom at once.
# output_dir = /mnt/f/Michele_diskF/mcrp_dicom_export

# ── Output voxel spacing [mm] ─────────────────────────────────────────────────
vol_vxy_mm = 0.3     # isotropic XY voxel size
vol_vz_mm  = 0.3     # Z voxel size

# ── Captured Z extent [mm] ────────────────────────────────────────────────────
# How far below the head tip to capture.  Clamped automatically to the
# phantom's own extent if it is shorter than this (never pads with air below
# real anatomy for short/newborn phantoms).
vol_length_mm = 300.0

# ── Air margin [mm] ───────────────────────────────────────────────────────────
# Flat padding added on every side (X-, X+, Y-, Y+, and above the head tip)
# around the tight bounding box of everything inside the captured Z window —
# not just the head, so wider anatomy (e.g. shoulders) is never cropped away.
air_margin_mm = 20.0

# Smoke-test cfg for the new dicom_to_mcgpu auto head/FOV placement +
# stretcher auto-seat (PLAN_dicom_to_mcgpu_auto_placement.md).
# Consumes an already-built MRCP tight-crop DICOM export (see
# params/mcrp_to_dicom_template.cfg) and places it automatically instead of
# via manually-measured dicom_corner_z_mm.

dicom_dir     = "/mnt/h/MICHELE_MCGPU/DICOM_EXPORT_MCRP/MRCP-15M_dicom_1444x834x1067"
output_prefix = "/mnt/h/MICHELE_MCGPU/MCGPU_EXPORT/MRCP-15M"

# ── Output volume geometry ───────────────────────────────────────────────────
vol_vxy_mm    = 0.3
vol_vz_mm     = 0.3
vol_width_mm  = 640.0
vol_height_mm = 640.0
vol_length_mm = 300.0

# ── HU thresholds [HU] ───────────────────────────────────────────────────────
thr_air_fat        = -500
thr_fat_soft       =  -50
thr_soft_spongiosa =  200
thr_spongiosa_cort =  800

denoise = false

# ── Automatic head/FOV placement (new) ──────────────────────────────────────
auto_head_placement = true
head_detect_thr_hu  = -500
head_at_max_z       = true
head_region_mm      = 100.0
head_top_margin_mm  = 10.0

# ── Stretcher (auto-seat, new) ───────────────────────────────────────────────
stretcher_enable       = true
stretcher_auto         = true
stretcher_cx_mm        = 0.0
stretcher_cy_offset_mm = 0.0
stretcher_gap_mm       = 2.0

# ── MC-GPU simulation template ───────────────────────────────────────────────
mcgpu_in_template  = params/cbct_head_bar_template.in
mcgpu_output_name  = results/MRCP-15M_
mcgpu_det_nx       = 512
mcgpu_det_nz       = 512

write_dicom = false

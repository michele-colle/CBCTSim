# ── Phantom & resolution ─────────────────────────────────────────
phantom_name   = MRCP-00F        # dash, not underscore! (adults: MRCP_AF / MRCP_AM)
voxel_size_mm  = 1.0

# ── ROI [mm from phantom bounding-box corner]; -1 = full extent ──
x_start_mm = 0.0
x_end_mm   = -1
y_start_mm = 0.0
y_end_mm   = -1
z_start_mm = 360.0              # head only (newborn is only ~482 mm tall;
z_end_mm   = -1                 #  1412 was for the adult phantom)

# ── Stretcher (optional) ─────────────────────────────────────────
stretcher_enable = true
stretcher_cx_mm  = 0.0          # polygon centre, X from isocenter [mm]
stretcher_cy_mm  = 133.5        # polygon centre, Y from isocenter [mm]
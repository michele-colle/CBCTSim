# Denoised test run: median filter + connected-component despeckle.
# Thin 30 mm slab for speed; median+despeckle still run on the FULL DICOM.
# Run from the repo root:  build/dicom_to_mcgpu denoise_checks/test_denoise.cfg
# NOTE: output_prefix is resolved relative to the DICOM dir's parent unless
# absolute (see dicom_to_mcgpu.cpp), so keep it absolute.
dicom_dir      = "/mnt/f/Michele_diskF/Test Fantoccio Zurigo-CBCTvsCT/patient_ct_registered"
output_prefix  = "/home/colle/CBCTSim/ICRPPhantomToMCGPU/denoise_checks/output/denoised/MCGPU"

vol_vxy_mm    = 0.3
vol_vz_mm     = 0.3
vol_width_mm  = 640.0
vol_height_mm = 640.0
vol_length_mm = 30.0   # thin slab: fast voxelization; set 250.0 for a full phantom

thr_air_fat        = -500
thr_fat_soft       =  -50
thr_soft_spongiosa =  600
thr_spongiosa_cort =  601

denoise                = true
median_radius          = 1     # voxels, 0=off  (3^3 kernel)
despeckle_min_size     = 20    # voxels, 0=off
despeckle_connectivity = 1     # 1=6-neigh, 2/3=26-neigh
despeckle_labels       = 0 3 4 # air, spongiosa, cortical

write_dicom = false
stretcher_enable = false
implant_count = 0
